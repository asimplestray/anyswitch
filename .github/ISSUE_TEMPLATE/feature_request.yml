name: Feature request
description: Propose a relinker, library, or shader improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which module changes (relinker/libs/shader/docs)? What is the smallest useful slice?
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: How should it be tested?
      placeholder: Synthetic fixture, unit test, or manual steps.
